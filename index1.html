<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registration</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 24px; }
    h1 { text-align: center; }
    form { max-width: 520px; padding: 16px; border: 1px solid #ddd; border-radius: 8px; margin: 0 auto; }
    .row { margin-bottom: 12px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    input[type="text"], input[type="tel"], select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .gender-group { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .gender-group label { display: inline-flex; gap: 8px; font-weight: 400; margin: 0; }
    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body style="font-family:Arial, Helvetica, sans-serif; margin:24px; background-color:#f2f2f2;">
  <h1 style="text-align:center; color:#2563eb;">Registration Form</h1>
<form action="success.html" method="get" style="max-width:520px; padding:16px; border:1px solid #ddd; border-radius:8px; margin:0 auto; background:white; box-shadow:0 0 10px lightgray;">    <div class="row">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" placeholder="Enter your name" required />
    </div>
<div style="margin-bottom:12px;">
<label style="display:block; margin-bottom:6px; font-weight:bold;">
 <input id="name" name="name" type="text" placeholder="Enter your name" required
style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box;">
    </div>
    <div class="row">
      <label>Gender</label>
      <div class="gender-group" role="radiogroup" aria-label="Gender">
        <label><input type="radio" name="gender" value="Male" required /> Male</label>
        <label><input type="radio" name="gender" value="Female" /> Female</label>
        <label><input type="radio" name="gender" value="Other" /> Other</label>
      </div>
    </div>
    <div class="row">
      <label for="department">Department</label>
      <select id="department" name="department" required>
        <option value="" selected disabled>Select department</option>
        <option value="CSE">CSE</option>
        <option value="ECE">ECE</option>
        <option value="EEE">EEE</option>
        <option value="MECH">Mechanical</option>
        <option value="CIVIL">Civil</option>
      </select>
    </div>
    <button type="submit">Registration</button>
  </form>
</body>
</html>
